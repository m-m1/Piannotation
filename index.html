<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Piannotation</title>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --switch-active: #0284c7;
    }

    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: env(safe-area-inset-top, 16px) 12px env(safe-area-inset-bottom, 16px) 12px;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    header {
      margin-top: 8px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      margin: 4px 0 0 0;
      color: var(--text-sub);
      font-size: 0.85rem;
      font-weight: 500;
    }

    /* Metronome Toolbar */
    .metronome-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 18px;
      border-radius: 9999px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      max-width: 96vw;
    }

    .metro-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: #334155;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .metro-btn:active {
      background: #475569;
    }

    .bpm-input-wrap {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }

    input#bpmInput {
      width: 48px;
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: 800;
      text-align: center;
      outline: none;
    }

    .bpm-label {
      font-size: 0.72rem;
      color: var(--text-sub);
      font-weight: 600;
      text-transform: uppercase;
    }

    /* Time Signature Select */
    .select-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    select#metroSignature {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }

    select#metroSignature option {
      background: #1e293b;
      color: #fff;
    }

    /* Accent Toggle in Metronome */
    .metro-accent-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    button#btnToggleMetro {
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 9999px;
      border: none;
      background: #0284c7;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }

    button#btnToggleMetro.active {
      background: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }

    /* Controls & Toggles Toolbar */
    .controls-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 14px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 18px;
      border-radius: 16px;
      margin-bottom: 12px;
      max-width: 96vw;
    }

    .switch-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .switch-label {
      cursor: pointer;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .25s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .25s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--switch-active);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    /* Multi-Mode Pill Switch */
    .segmented-control {
      display: inline-flex;
      background: #0f172a;
      border-radius: 9999px;
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .segment-btn {
      padding: 5px 12px;
      font-size: 0.76rem;
      font-weight: 600;
      border-radius: 9999px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .segment-btn.active {
      background: var(--switch-active);
      color: #fff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    .btn-secondary {
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #1e293b;
      color: var(--text-sub);
      cursor: pointer;
    }

    .btn-secondary:active {
      background: #334155;
      color: #fff;
    }

    #debug-info {
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    #demo-tip {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 10px;
    }

    /* Output Badge */
    #output-badge {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 18px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      box-shadow: 0 4px 18px rgba(0,0,0,0.3);
      margin-bottom: 14px;
      max-width: 92vw;
      white-space: nowrap;
      overflow-x: auto;
    }

    /* Main Staff Card */
    #current-staff-card {
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 250px;
      min-height: 230px;
      direction: ltr;
    }

    /* Keyboard */
    .keyboard-scroll-wrap {
      margin-top: 14px;
      max-width: 96vw;
      overflow-x: auto;
      padding-bottom: 6px;
      border-radius: 8px;
      touch-action: pan-x;
    }

    #keyboard {
      position: relative;
      display: inline-flex;
      background: #000;
      padding: 10px 6px 6px 6px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      direction: ltr;
    }

    .key {
      position: relative;
      border-radius: 0 0 4px 4px;
      transition: background-color 0.1s ease, transform 0.05s ease;
      cursor: pointer;
    }

    .key.white {
      width: 20px;
      height: 105px;
      background: #fdfdfd;
      border: 1px solid #ccc;
      border-top: none;
      z-index: 1;
      margin-right: -1px;
    }

    .key.black {
      width: 13px;
      height: 66px;
      background: #18181b;
      margin-left: -6.5px;
      margin-right: -6.5px;
      z-index: 2;
      border: 1px solid #000;
      box-shadow: inset 0 -2px 3px rgba(255,255,255,0.15);
    }

    .key.pressed {
      transform: translateY(3px);
    }

    /* Continuous Stream Section */
    #streamSection {
      width: 100%;
      max-width: 96vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 14px;
    }

    .stream-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 6px;
      padding: 0 4px;
    }

    .stream-label {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    .history-scroll-wrap {
      width: 100%;
      background: #ffffff;
      border-radius: 14px;
      overflow-x: auto;
      padding: 10px 12px;
      direction: ltr;
      min-height: 230px;
    }

    #historyStaff {
      min-height: 230px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <header>
    <h1>Piannotation</h1>
    <p class="subtitle">Real-time pitch detection & notation</p>
  </header>

  <!-- Metronome Toolbar with Time Signatures and Accent Switch -->
  <div class="metronome-bar">
    <button class="metro-btn" id="btnBpmDown">−</button>
    <div class="bpm-input-wrap">
      <input type="number" id="bpmInput" value="120" min="40" max="240">
      <span class="bpm-label">BPM</span>
    </div>
    <button class="metro-btn" id="btnBpmUp">+</button>

    <!-- Time Signature Selector -->
    <div class="select-wrap">
      <select id="metroSignature">
        <optgroup label="Standard / Simple">
          <option value="4/4" selected>4/4</option>
          <option value="3/4">3/4</option>
          <option value="2/4">2/4</option>
          <option value="2/2">2/2</option>
        </optgroup>
        <optgroup label="Compound / Triple">
          <option value="6/8">6/8</option>
          <option value="9/8">9/8</option>
          <option value="12/8">12/8</option>
        </optgroup>
        <optgroup label="Odd / Complex">
          <option value="5/4">5/4</option>
          <option value="5/8">5/8</option>
          <option value="7/4">7/4</option>
          <option value="7/8">7/8</option>
          <option value="11/8">11/8</option>
        </optgroup>
      </select>
    </div>

    <!-- Accent First Beat Toggle -->
    <div class="metro-accent-wrap">
      <span>Accent 1st:</span>
      <label class="toggle-switch">
        <input type="checkbox" id="switchAccent" checked>
        <span class="slider"></span>
      </label>
    </div>

    <button id="btnToggleMetro">START</button>
  </div>

  <!-- Settings Bar -->
  <div class="controls-panel">
    <button class="btn-secondary" id="btnReconnect">MIDI: Auto-Connecting...</button>

    <!-- Middle Octaves C3-C5 Switch -->
    <div class="switch-group">
      <span class="switch-label">Middle Octaves (C3–C5):</span>
      <label class="toggle-switch">
        <input type="checkbox" id="switchDualMiddle" checked>
        <span class="slider"></span>
      </label>
      <span id="textDualMiddle" style="color: var(--accent); font-weight:700;">ON</span>
    </div>

    <!-- Mode Switch (Single vs Continuous) -->
    <div class="switch-group">
      <span>Mode:</span>
      <div class="segmented-control">
        <button class="segment-btn active" id="btnModeSingle">Single</button>
        <button class="segment-btn" id="btnModeStream">Continuous</button>
      </div>
    </div>
  </div>

  <div id="debug-info">Scanning for MIDI devices...</div>
  <div id="demo-tip">💡 No MIDI? Click or touch on-screen keys, or use your computer keyboard (A-K)!</div>
  <div id="output-badge">Play keys on your piano or screen...</div>

  <!-- Primary Staff Card -->
  <div id="current-staff-card">
    <div id="currentStaff"></div>
  </div>

  <!-- Keyboard -->
  <div class="keyboard-scroll-wrap" id="kbWrap">
    <div id="keyboard"></div>
  </div>

  <!-- Stream Section -->
  <div id="streamSection" style="display: none;">
    <div class="stream-header">
      <div class="stream-label">Continuous Notation Stream</div>
      <button class="btn-secondary" id="btnClearHistory">Clear</button>
    </div>
    <div class="history-scroll-wrap" id="historyWrap">
      <div id="historyStaff"></div>
    </div>
  </div>

  <script>
    const VF = Vex.Flow;

    const noteMap = [
      { letter: "c",  base: "c", isSharp: false, name: "C",  solfege: "Do",  color: "#ef4444" },
      { letter: "c#", base: "c", isSharp: true,  name: "C#", solfege: "Do#", color: "#f87171" },
      { letter: "d",  base: "d", isSharp: false, name: "D",  solfege: "Re",  color: "#f97316" },
      { letter: "d#", base: "d", isSharp: true,  name: "D#", solfege: "Re#", color: "#fb923c" },
      { letter: "e",  base: "e", isSharp: false, name: "E",  solfege: "Mi",  color: "#eab308" },
      { letter: "f",  base: "f", isSharp: false, name: "F",  solfege: "Fa",  color: "#22c55e" },
      { letter: "f#", base: "f", isSharp: true,  name: "F#", solfege: "Fa#", color: "#4ade80" },
      { letter: "g",  base: "g", isSharp: false, name: "G",  solfege: "Sol", color: "#3b82f6" },
      { letter: "g#", base: "g", isSharp: true,  name: "G#", solfege: "Sol#",color: "#60a5fa" },
      { letter: "a",  base: "a", isSharp: false, name: "A",  solfege: "La",  color: "#a855f7" },
      { letter: "a#", base: "a", isSharp: true,  name: "A#", solfege: "La#", color: "#c084fc" },
      { letter: "b",  base: "b", isSharp: false, name: "B",  solfege: "Si",  color: "#ec4899" }
    ];

    let dualMiddleOctaves = true;
    let viewMode = "single";

    const physicallyHeldKeys = new Set();
    let displayedNotes = [];
    const historyEvents = [];
    let pendingChordTimeout = null;
    let currentChordNotes = [];

    // --- High-Quality Acoustic Piano Synthesis ---
    let audioCtx = null;
    const activeVoices = new Map();

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function playPianoTone(midi) {
      const ctx = getAudioContext();
      if (activeVoices.has(midi)) {
        stopPianoTone(midi, true);
      }

      const freq = midiToFreq(midi);
      const now = ctx.currentTime;

      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(Math.min(freq * 6, 8500), now);
      filter.frequency.exponentialRampToValueAtTime(Math.max(freq * 1.8, 450), now + 2.5);

      const mainGain = ctx.createGain();
      mainGain.gain.setValueAtTime(0.0001, now);
      mainGain.gain.linearRampToValueAtTime(0.7, now + 0.015);
      mainGain.gain.exponentialRampToValueAtTime(0.2, now + 0.8);
      mainGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

      const osc1 = ctx.createOscillator();
      osc1.type = "sine";
      osc1.frequency.setValueAtTime(freq, now);

      const osc2 = ctx.createOscillator();
      osc2.type = "triangle";
      osc2.frequency.setValueAtTime(freq * 2, now);

      const osc3 = ctx.createOscillator();
      osc3.type = "sine";
      osc3.frequency.setValueAtTime(freq * 3, now);

      const g2 = ctx.createGain(); g2.gain.value = 0.28;
      const g3 = ctx.createGain(); g3.gain.value = 0.12;

      osc1.connect(mainGain);
      osc2.connect(g2); g2.connect(mainGain);
      osc3.connect(g3); g3.connect(mainGain);

      mainGain.connect(filter);
      filter.connect(ctx.destination);

      osc1.start(now);
      osc2.start(now);
      osc3.start(now);

      activeVoices.set(midi, { oscs: [osc1, osc2, osc3], mainGain });
    }

    function stopPianoTone(midi, immediate = false) {
      const voice = activeVoices.get(midi);
      if (!voice) return;
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const releaseTime = immediate ? 0.05 : 1.2;

      voice.mainGain.gain.cancelScheduledValues(now);
      voice.mainGain.gain.setValueAtTime(voice.mainGain.gain.value, now);
      voice.mainGain.gain.exponentialRampToValueAtTime(0.0001, now + releaseTime);

      setTimeout(() => {
        voice.oscs.forEach(osc => {
          try { osc.stop(); osc.disconnect(); } catch(e) {}
        });
      }, releaseTime * 1000 + 50);

      activeVoices.delete(midi);
    }

    // --- Build Keyboard ---
    const keyboardEl = document.getElementById("keyboard");
    const keyElements = new Map();

    for (let midi = 21; midi <= 108; midi++) {
      const data = noteMap[midi % 12];
      const el = document.createElement("div");
      el.className = `key ${data.isSharp ? 'black' : 'white'}`;
      el.dataset.midi = midi;

      el.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        triggerNoteOn(midi, 100, true);
      });

      const endHandler = (e) => {
        e.preventDefault();
        triggerNoteOff(midi);
      };

      el.addEventListener("pointerup", endHandler);
      el.addEventListener("pointerleave", endHandler);
      el.addEventListener("pointercancel", endHandler);

      keyboardEl.appendChild(el);
      keyElements.set(midi, { el, data });
    }

    // --- Metronome Engine with Signatures & Accent ---
    let isMetroRunning = false;
    let metroInterval = null;
    let currentBpm = 120;
    let currentBeatInBar = 0;

    const bpmInput = document.getElementById("bpmInput");
    const btnToggleMetro = document.getElementById("btnToggleMetro");
    const metroSignature = document.getElementById("metroSignature");
    const switchAccent = document.getElementById("switchAccent");

    function getSignatureDetails() {
      const parts = metroSignature.value.split("/");
      return {
        beats: parseInt(parts[0], 10),
        unit: parseInt(parts[1], 10)
      };
    }

    function playClick() {
      const ctx = getAudioContext();
      const { beats } = getSignatureDetails();
      const shouldAccent = switchAccent.checked && currentBeatInBar === 0;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.value = shouldAccent ? 1600 : 900;

      const peakGain = shouldAccent ? 1.0 : 0.6;
      gain.gain.setValueAtTime(peakGain, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (shouldAccent ? 0.06 : 0.04));

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 0.07);

      currentBeatInBar = (currentBeatInBar + 1) % beats;
    }

    function startMetronome() {
      if (metroInterval) clearInterval(metroInterval);
      currentBeatInBar = 0;

      const { unit } = getSignatureDetails();
      // For /8 time signatures, interval is half of /4 tempo
      const multiplier = unit === 8 ? 0.5 : (unit === 2 ? 2.0 : 1.0);
      const intervalMs = (60 / currentBpm) * 1000 * multiplier;

      playClick();
      metroInterval = setInterval(playClick, intervalMs);
      isMetroRunning = true;
      btnToggleMetro.innerText = "STOP";
      btnToggleMetro.classList.add("active");
    }

    function stopMetronome() {
      if (metroInterval) clearInterval(metroInterval);
      isMetroRunning = false;
      currentBeatInBar = 0;
      btnToggleMetro.innerText = "START";
      btnToggleMetro.classList.remove("active");
    }

    btnToggleMetro.addEventListener("click", () => {
      if (isMetroRunning) stopMetronome();
      else startMetronome();
    });

    document.getElementById("btnBpmDown").addEventListener("click", () => {
      currentBpm = Math.max(40, currentBpm - 5);
      bpmInput.value = currentBpm;
      if (isMetroRunning) startMetronome();
    });

    document.getElementById("btnBpmUp").addEventListener("click", () => {
      currentBpm = Math.min(240, currentBpm + 5);
      bpmInput.value = currentBpm;
      if (isMetroRunning) startMetronome();
    });

    bpmInput.addEventListener("change", () => {
      let val = parseInt(bpmInput.value, 10);
      if (isNaN(val)) val = 120;
      currentBpm = Math.max(40, Math.min(240, val));
      bpmInput.value = currentBpm;
      if (isMetroRunning) startMetronome();
    });

    metroSignature.addEventListener("change", () => {
      if (isMetroRunning) startMetronome();
    });

    // --- Options Logic ---
    const switchDualMiddle = document.getElementById("switchDualMiddle");
    const textDualMiddle = document.getElementById("textDualMiddle");

    switchDualMiddle.addEventListener("change", (e) => {
      dualMiddleOctaves = e.target.checked;
      textDualMiddle.innerText = dualMiddleOctaves ? "ON" : "OFF";
      textDualMiddle.style.color = dualMiddleOctaves ? "var(--accent)" : "var(--text-sub)";
      updateLiveVoicingDisplay();
      if (viewMode === "stream") renderHistoryStaff();
    });

    const btnModeSingle = document.getElementById("btnModeSingle");
    const btnModeStream = document.getElementById("btnModeStream");
    const streamSection = document.getElementById("streamSection");

    btnModeSingle.addEventListener("click", () => {
      viewMode = "single";
      btnModeSingle.classList.add("active");
      btnModeStream.classList.remove("active");
      streamSection.style.display = "none";
    });

    btnModeStream.addEventListener("click", () => {
      viewMode = "stream";
      btnModeStream.classList.add("active");
      btnModeSingle.classList.remove("active");
      streamSection.style.display = "flex";
      renderHistoryStaff();
    });

    document.getElementById("btnClearHistory").addEventListener("click", () => {
      historyEvents.length = 0;
      renderHistoryStaff();
    });

    // --- MIDI Setup ---
    document.getElementById("btnReconnect").addEventListener("click", initMIDI);

    function initMIDI() {
      if (!navigator.requestMIDIAccess) {
        document.getElementById("debug-info").innerText = "Web MIDI API not supported in this browser. Virtual keys active!";
        return;
      }
      navigator.requestMIDIAccess({ sysex: false }).then(onMIDISuccess, (err) => {
        document.getElementById("debug-info").innerText = "MIDI Access Denied: " + err;
      });
    }

    function bindInputs(midiAccess) {
      const inputs = [];
      midiAccess.inputs.forEach((input) => {
        input.onmidimessage = handleMIDIMessage;
        inputs.push(input.name || "MIDI Device");
      });

      const debug = document.getElementById("debug-info");
      const btn = document.getElementById("btnReconnect");
      if (inputs.length > 0) {
        debug.innerText = `Connected: ${inputs.join(", ")}`;
        btn.innerText = `MIDI: Connected (${inputs.length})`;
      } else {
        debug.innerText = "Listening for MIDI hardware (Virtual keyboard active)...";
        btn.innerText = "MIDI: Reconnect";
      }
    }

    function onMIDISuccess(midiAccess) {
      bindInputs(midiAccess);
      midiAccess.onstatechange = () => bindInputs(midiAccess);
    }

    window.addEventListener("DOMContentLoaded", () => {
      initMIDI();
      renderCurrentStaff([]);
      
      const c4Key = keyElements.get(60);
      if (c4Key) {
        c4Key.el.scrollIntoView({ inline: "center", behavior: "smooth" });
      }
    });

    function handleMIDIMessage(event) {
      const [status, noteNumber, velocity] = event.data;
      const command = status & 0xf0;

      if (command === 0x90 && velocity > 0) {
        triggerNoteOn(noteNumber, velocity, false);
      } else if (command === 0x80 || (command === 0x90 && velocity === 0)) {
        triggerNoteOff(noteNumber);
      }
    }

    function triggerNoteOn(midi, velocity, isVirtual = false) {
      playPianoTone(midi);

      if (physicallyHeldKeys.size === 0 && displayedNotes.length > 0) {
        clearDisplayedColors();
        displayedNotes = [];
      }

      physicallyHeldKeys.add(midi);
      if (!displayedNotes.includes(midi)) {
        displayedNotes.push(midi);
      }

      const item = keyElements.get(midi);
      if (item) {
        item.el.classList.add("pressed");
        item.el.style.backgroundColor = item.data.color;
        item.el.style.boxShadow = `0 0 12px ${item.data.color}`;
      }

      recordForHistory(midi);
      updateLiveVoicingDisplay();
    }

    function triggerNoteOff(midi) {
      stopPianoTone(midi);
      physicallyHeldKeys.delete(midi);

      const item = keyElements.get(midi);
      if (item) {
        item.el.classList.remove("pressed");
      }
    }

    function clearDisplayedColors() {
      displayedNotes.forEach(m => {
        const item = keyElements.get(m);
        if (item) {
          item.el.style.backgroundColor = item.data.isSharp ? '#18181b' : '#fdfdfd';
          item.el.style.boxShadow = item.data.isSharp ? 'inset 0 -2px 3px rgba(255,255,255,0.15)' : 'none';
        }
      });
    }

    function updateLiveVoicingDisplay() {
      if (displayedNotes.length === 0) return;

      const badge = document.getElementById("output-badge");
      const sorted = [...displayedNotes].sort((a, b) => a - b);
      const labels = sorted.map(m => {
        const d = noteMap[m % 12];
        const oct = Math.floor(m / 12) - 1;
        return `${d.name}${oct} (${d.solfege})`;
      });

      badge.innerText = labels.join(" • ");
      renderCurrentStaff(sorted);
    }

    // QWERTY Mapping
    const keyMap = {
      'a': 60, 'w': 61, 's': 62, 'e': 63, 'd': 64, 'f': 65,
      't': 66, 'g': 67, 'y': 68, 'h': 69, 'u': 70, 'j': 71, 'k': 72
    };

    window.addEventListener("keydown", (e) => {
      if (e.repeat || e.target.tagName === "INPUT") return;
      const k = e.key.toLowerCase();
      if (keyMap[k]) triggerNoteOn(keyMap[k], 100, true);
    });

    window.addEventListener("keyup", (e) => {
      if (e.target.tagName === "INPUT") return;
      const k = e.key.toLowerCase();
      if (keyMap[k]) triggerNoteOff(keyMap[k]);
    });

    function recordForHistory(midi) {
      currentChordNotes.push(midi);
      clearTimeout(pendingChordTimeout);
      pendingChordTimeout = setTimeout(() => {
        if (currentChordNotes.length > 0) {
          const chord = Array.from(new Set(currentChordNotes)).sort((a, b) => a - b);
          historyEvents.push(chord);
          currentChordNotes = [];
          if (viewMode === "stream") renderHistoryStaff();
        }
      }, 40);
    }

    function buildClefNote(notes, clef) {
      const filtered = notes.filter(n => {
        const isMiddleOctave = (n >= 48 && n < 72);
        if (dualMiddleOctaves && isMiddleOctave) {
          return true;
        }
        return clef === "treble" ? n >= 60 : n < 60;
      });

      if (filtered.length === 0) {
        return new VF.StaveNote({
          clef: clef,
          keys: [clef === "treble" ? "b/4" : "d/3"],
          duration: "wr"
        });
      }

      const keys = [];
      const accidentals = [];
      filtered.forEach((midi, idx) => {
        const data = noteMap[midi % 12];
        const oct = Math.floor(midi / 12) - 1;
        keys.push(`${data.base}/${oct}`);
        if (data.isSharp) accidentals.push(idx);
      });

      const staveNote = new VF.StaveNote({ clef, keys, duration: "w" });
      accidentals.forEach(i => staveNote.addModifier(new VF.Accidental("#"), i));
      return staveNote;
    }

    function renderCurrentStaff(midiArray) {
      const container = document.getElementById("currentStaff");
      container.innerHTML = "";

      const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
      renderer.resize(250, 230);
      const context = renderer.getContext();

      const trebleStave = new VF.Stave(20, 10, 200);
      trebleStave.addClef("treble").setContext(context).draw();

      const bassStave = new VF.Stave(20, 115, 200);
      bassStave.addClef("bass").setContext(context).draw();

      new VF.StaveConnector(trebleStave, bassStave).setType(VF.StaveConnector.type.BRACE).setContext(context).draw();
      new VF.StaveConnector(trebleStave, bassStave).setType(VF.StaveConnector.type.SINGLE_LEFT).setContext(context).draw();

      if (midiArray.length > 0) {
        const tNote = buildClefNote(midiArray, "treble");
        const bNote = buildClefNote(midiArray, "bass");
        VF.Formatter.FormatAndDraw(context, trebleStave, [tNote]);
        VF.Formatter.FormatAndDraw(context, bassStave, [bNote]);
      }
    }

    function renderHistoryStaff() {
      const container = document.getElementById("historyStaff");
      container.innerHTML = "";
      if (historyEvents.length === 0) return;

      const spacing = 75;
      const width = Math.max(300, 70 + historyEvents.length * spacing);

      const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
      renderer.resize(width, 230);
      const context = renderer.getContext();

      const trebleStave = new VF.Stave(20, 10, width - 30);
      trebleStave.addClef("treble").setContext(context).draw();

      const bassStave = new VF.Stave(20, 115, width - 30);
      bassStave.addClef("bass").setContext(context).draw();

      new VF.StaveConnector(trebleStave, bassStave).setType(VF.StaveConnector.type.BRACE).setContext(context).draw();
      new VF.StaveConnector(trebleStave, bassStave).setType(VF.StaveConnector.type.SINGLE_LEFT).setContext(context).draw();

      const tNotes = [];
      const bNotes = [];

      historyEvents.forEach(chord => {
        tNotes.push(buildClefNote(chord, "treble"));
        bNotes.push(buildClefNote(chord, "bass"));
      });

      const voiceT = new VF.Voice({ num_beats: historyEvents.length, beat_value: 1 }).setStrict(false);
      voiceT.addTickables(tNotes);

      const voiceB = new VF.Voice({ num_beats: historyEvents.length, beat_value: 1 }).setStrict(false);
      voiceB.addTickables(bNotes);

      new VF.Formatter().joinVoices([voiceT]).joinVoices([voiceB]).format([voiceT, voiceB], width - 90);

      voiceT.draw(context, trebleStave);
      voiceB.draw(context, bassStave);

      const wrap = document.getElementById("historyWrap");
      wrap.scrollLeft = wrap.scrollWidth;
    }
  </script>
</body>
</html>
